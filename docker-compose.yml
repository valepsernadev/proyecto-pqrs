services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sistema_pqrs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_pqrs"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/SistemaPQRS.Api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=sistema_pqrs;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

volumes:
  pgdata:
